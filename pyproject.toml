[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "z2haptics"
version = "0.1.0"
description = "Audio-driven haptic feedback for the Swiftpoint Z2 mouse"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "soundcard>=0.4.3",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
dev = ["pytest>=7.0", "PySide6>=6.6"]

[project.scripts]
z2haptics = "z2haptics.cli:main"

[project.gui-scripts]
z2haptics-gui = "z2haptics.gui.app:main"

[tool.setuptools]
packages = ["z2haptics", "z2haptics.gui"]

[tool.setuptools.package-data]
z2haptics = ["../profiles/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
