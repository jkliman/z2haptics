name: FPS
description: >
  Generic shooter tuning. Three bands separate the things that want to feel
  different: the low thump of explosions, the mid-range body of a weapon report,
  and the high crack of a near miss.

  Tuned for precision rather than raw detection. In a dense mix the failure mode
  is not missing events, it is firing on everything -- music and explosions
  trigger the gunfire band far more often than gunfire does, and the motor ends
  up buzzing continuously. min_flatness rejects tonal content (gunshots measure
  ~0.90 spectral flatness, music ~0.11), and the busier bands are rate-capped so
  they cannot starve the band you actually care about.

processes:
  - cs2.exe
  - r5apex.exe
  - VALORANT-Win64-Shipping.exe
  - RainbowSix.exe
  - ModernWarfare.exe
  - DOOMEternalx64vk.exe

strength_scale: 1.0

limits:
  min_gap_ms: 45
  max_pulses_sec: 12
  max_duty: 0.50

bands:
  # Explosions, grenades, vehicle booms.
  - name: impact
    low_hz: 20
    high_hz: 90
    sensitivity: 2.4
    gate: 0.0035
    refractory_ms: 150
    min_flatness: 0.25
    max_rate: 5
    duration_ms: 95
    strength_min: 55
    strength_max: 100
    level_floor_db: -49.1
    level_ceil_db: -23.1
    priority: 2

  # Weapon report body. The workhorse band -- most pulses come from here.
  - name: gunfire
    low_hz: 90
    high_hz: 450
    sensitivity: 2.2
    gate: 0.0030
    refractory_ms: 110
    min_share: 0.20
    min_flatness: 0.45
    duration_ms: 45
    strength_min: 38
    strength_max: 82
    level_floor_db: -50.5
    level_ceil_db: -24.5
    priority: 2

  # Supersonic cracks and close whizz-by. Short and light -- an accent, not a hit.
  - name: crack
    low_hz: 2000
    high_hz: 6500
    sensitivity: 2.8
    gate: 0.0022
    refractory_ms: 170
    min_share: 0.25
    min_flatness: 0.50
    max_rate: 3
    duration_ms: 22
    strength_min: 22
    strength_max: 50
    level_floor_db: -53.2
    level_ceil_db: -27.2
    priority: 1
