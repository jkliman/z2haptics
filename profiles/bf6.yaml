name: Battlefield 6
description: >
  Tuned against 42 real captures from this game rather than from assumption --
  see ~/.z2haptics/sessions/bf6 and tools/validate_weapons.py.

  The band layout here is the single biggest correction. The original profile
  put gunfire at 90-500Hz on the reasonable-sounding theory that a weapon report
  is a mid-range thump. Measured, it is not: across every captured weapon only
  2-12% of the energy sits below 500Hz, while 60-75% sits above 2kHz. BF6
  gunfire is dominated by mechanical crack and high-frequency transient, so the
  band that matters is 1500-9000Hz.

  Weapon identification is enabled on that band via the bf6 weapon set. Measured
  by leave-one-out cross-validation on the captures: the LMG is identified 7/7,
  the sniper 8/11, and assault/SMG are not separable from each other so they
  share one "rifle" class which mostly declines to this band's generic pulse.
  Declining is the intended outcome -- a confidently wrong weapon feels worse
  than a generic hit.

processes:
  - bf6.exe
  - bf.exe
  - bf2042.exe

x1_profile: bf6
weapon_set: bf6

strength_scale: 1.05

limits:
  min_gap_ms: 45
  max_pulses_sec: 12
  max_duty: 0.50

bands:
  # Explosions and heavy impacts. Real captures show 19-28% of energy down here
  # on the heavier weapons, so it earns its place -- but it is rate-capped so a
  # barrage cannot monopolise the single motor.
  - name: impact
    low_hz: 20
    high_hz: 120
    sensitivity: 2.4
    gate: 0.0045
    refractory_ms: 150
    min_flatness: 0.25
    max_rate: 5
    duration_ms: 105
    strength_min: 60
    strength_max: 100
    level_floor_db: -47.0
    level_ceil_db: -21.0
    priority: 2

  # Gunfire, where it actually lives. This is the band the weapon classifier
  # runs on.
  - name: gunfire
    low_hz: 1500
    high_hz: 9000
    sensitivity: 2.2
    gate: 0.0030
    refractory_ms: 90
    min_flatness: 0.45
    classify: true
    duration_ms: 42
    strength_min: 42
    strength_max: 85
    level_floor_db: -50.0
    level_ceil_db: -24.0
    priority: 2

  # Mid-range body. Weak in this game's mix, so it is a light accent only and
  # deliberately low priority -- it exists to catch the occasional muffled or
  # distant report that the main band misses.
  - name: body
    low_hz: 300
    high_hz: 1500
    sensitivity: 2.6
    gate: 0.0032
    refractory_ms: 160
    min_share: 0.25
    min_flatness: 0.40
    max_rate: 3
    duration_ms: 30
    strength_min: 25
    strength_max: 55
    level_floor_db: -49.9
    level_ceil_db: -23.9
    priority: 1
